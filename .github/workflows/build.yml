          package com.sumon.ai;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          public class PhoneAccessibilityService extends AccessibilityService {
              static volatile PhoneAccessibilityService inst;

              @Override protected void onServiceConnected() { inst = this; }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) { }
              @Override public void onInterrupt() { }
              @Override public boolean onUnbind(Intent i) { inst = null; return super.onUnbind(i); }

              static String dump() {
                  PhoneAccessibilityService s = inst;
                  if (s == null) return "(accessibility is OFF)";
                  AccessibilityNodeInfo r = s.getRootInActiveWindow();
                  if (r == null) return "(empty screen)";
                  StringBuilder b = new StringBuilder();
                  walk(r, b);
                  return b.toString();
              }

              static void walk(AccessibilityNodeInfo n, StringBuilder b) {
                  if (n == null || b.length() > 3500) return;
                  if (n.isVisibleToUser()) {
                      CharSequence t = n.getText(), c = n.getContentDescription();
                      String x = t != null ? t.toString() : (c != null ? c.toString() : "");
                      if (!x.isEmpty() || n.isEditable())
                          b.append(n.isEditable() ? "[input] " : n.isClickable() ? "[tap] " : "").append(x).append('\n');
                  }
                  for (int i = 0; i < n.getChildCount(); i++) walk(n.getChild(i), b);
              }

              static AccessibilityNodeInfo find(AccessibilityNodeInfo n, String q, boolean editable, boolean scrollable) {
                  if (n == null) return null;
                  if (n.isVisibleToUser()) {
                      if (editable && n.isEditable()) return n;
                      if (scrollable && n.isScrollable()) return n;
                      CharSequence t = n.getText(), c = n.getContentDescription();
                      if (q != null && ((t != null && t.toString().toLowerCase().contains(q)) || (c != null && c.toString().toLowerCase().contains(q)))) return n;
                  }
                  for (int i = 0; i < n.getChildCount(); i++) {
                      AccessibilityNodeInfo r = find(n.getChild(i), q, editable, scrollable);
                      if (r != null) return r;
                  }
                  return null;
              }

              static boolean click(String q) {
                  PhoneAccessibilityService s = inst;
                  if (s == null) return false;
                  AccessibilityNodeInfo n = find(s.getRootInActiveWindow(), q.toLowerCase(), false, false);
                  while (n != null && !n.isClickable()) n = n.getParent();
                  return n != null && n.performAction(AccessibilityNodeInfo.ACTION_CLICK);
              }

              static boolean type(String x) {
                  PhoneAccessibilityService s = inst;
                  if (s == null) return false;
                  AccessibilityNodeInfo f = s.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                  if (f == null) f = find(s.getRootInActiveWindow(), null, true, false);
                  if (f == null) return false;
                  Bundle b = new Bundle();
                  b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, x);
                  return f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b);
              }

              static boolean enter() {
                  PhoneAccessibilityService s = inst;
                  if (s == null || Build.VERSION.SDK_INT < 30) return false;
                  AccessibilityNodeInfo f = s.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                  return f != null && f.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.getId());
              }

              static boolean scroll(boolean down) {
                  PhoneAccessibilityService s = inst;
                  if (s == null) return false;
                  AccessibilityNodeInfo n = find(s.getRootInActiveWindow(), null, false, true);
                  return n != null && n.performAction(down ? AccessibilityNodeInfo.ACTION_SCROLL_FORWARD : AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD);
              }

              static boolean glob(int a) {
                  PhoneAccessibilityService s = inst;
                  return s != null && s.performGlobalAction(a);
              }
          }
